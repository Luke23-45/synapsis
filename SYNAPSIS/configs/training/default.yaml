# Training Configuration

# =========================================================================
# OPTIMIZER
# =========================================================================
learning_rate: 1.0e-4
weight_decay: 0.01
warmup_steps: 1000
max_grad_norm: 1.0
use_amp: true

# =========================================================================
# LOSS WEIGHTS
# =========================================================================
flow_loss_weight: 1.0
phase_loss_weight: 0.1
topo_loss_weight: 0.01
diversity_loss_weight: 0.01
consistency_loss_weight: 0.1
use_consistency_loss: true

# =========================================================================
# CURRICULUM LEARNING
# =========================================================================
temp_anneal_epochs: 50
temp_end: 0.1
lambda_anneal_epochs: 50

# =========================================================================
# BATCH AND EPOCHS
# =========================================================================
batch_size: 32
max_epochs: 250
val_check_interval: 1
gradient_accumulation_steps: 1

# =========================================================================
# DATA
# =========================================================================
num_samples: 5000
val_samples: 50

# =========================================================================
# CHECKPOINTING
# =========================================================================
save_dir: checkpoints
log_interval: 10
seed: 42

# =========================================================================
# LOGGING (Optional)
# =========================================================================
use_wandb: false
wandb_project: SYNAPSIS
