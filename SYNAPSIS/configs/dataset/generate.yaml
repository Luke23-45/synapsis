# SOTA Dataset Generation Config - Production Training Data
run_name: "expert_pick_place"
num_episodes: 500
num_workers: 2
seed: 12345
output_dir: "output_data/expert_demos/"

# Environment Paths
urdf_path: "SYNAPSIS/envs/urdf/panda.urdf"
xml_path: "SYNAPSIS/envs/panda_pick_place.xml"

# Robot Configuration
control_mode: "absolute"
recording_mode: "cartesian_delta"
grasp_width: 0.6
action_scaling_factor: 0.5

# Expert Parameters
expert_config:
  noise_level: 0.01
  failure_timeout_steps: 500

# Serialization
image_compression: "jpeg"
jpeg_quality: 90

# ==============================================================================
# CURRICULUM SETTINGS (REMOVED)
# ==============================================================================
# Curriculum staging has been replaced by Domain Randomization and Single-Pass Generation.


# ==============================================================================
# DATASET SPLIT SETTINGS
# ==============================================================================
# When enabled, generates separate train/ and val/ directories with
# independent, complete LMDB datasets. When disabled, a single dataset
# is produced (current behavior).
dataset_split:
  enable: true
  train_episodes: 500           # Number of episodes for the training set
  val_episodes: 50              # Number of episodes for the validation set
  val_seed_offset: 500000       # Added to base seed for val generation (ensures no overlap)
  val_run_name_suffix: "_val"  # Appended to run_name for the validation dataset

# ==============================================================================
# ADVANTAGE CALCULATION SETTINGS
# ==============================================================================
# These parameters are used by advantage_calculator.py.
advantage:
  gamma: 0.99                  # Discount factor
  lambda: 0.95                 # GAE lambda
  beta_cost: 0.5               # Cost weight for safe AWR
  huber_delta: 1.0             # Robust loss parameter
  pessimistic_clip: 0.0        # Clip advantages below this value
  time_weight: 0.5             # Weight for time baseline vs phase baseline
