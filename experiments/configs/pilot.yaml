# SYNAPSE Diagnostic Layer: Pilot Data
# ==========================================
# Self-contained config for internal diagnostic
# and exploratory experiments (PC-07).
#
# Experiments:
#   pilot_diagnostics    - in-house pilot data analysis

# --- Memory operator parameters ---
memory:
  K: 10
  r: 2
  tau: 0.5
  Q: 1
  weights: [1.0, 1.0, 1.0, 1.0]

# --- In-house pilot ---
# Note: Using applied robotics data as pilot if internal paths are empty
inhouse_pilot:
  export_root: "applied/robotics/output_data/exports"
  index_json: "applied/robotics/output_data/raw/final_training_set/training_set_index.json"
  min_episode_length: 20

# --- Acceptance gates ---
acceptance_gates:
  pilot_coverage: 0.5

# --- Output ---
output_dir: experiments/outputs

# --- Plotting ---
plotting:
  theme: publication
  formats: [png, pdf]
  dpi: 600
