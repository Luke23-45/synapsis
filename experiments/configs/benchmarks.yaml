# SYNAPSE Benchmarks Configuration
# ====================================
# Self-contained config for public data comparisons
# and ablation studies (PC-05, PC-06).
#
# Experiments:
#   public_benchmark    - SYNAPSE vs baselines on public state data
#   ablation_study      - isolate topology and anchor scoring gains

# --- Memory operator parameters ---
memory:
  K: 10
  r: 2
  tau: 0.5
  Q: 1
  weights: [1.0, 1.0, 1.0, 1.0]

# --- Synthetic task generation (for ablation study) ---
synthetic_tasks:
  seq_len: 100
  state_dim: 8
  train_samples: 200
  val_samples: 50
  test_samples: 100
  event_recovery_trials: 30
  noise_levels: [0.05, 0.15, 0.3]
  distractor_levels: [0.2, 0.6, 1.2]
  task_families:
    - delayed_retrieval
    - ordered_trigger_response
    - phase_conditioned_decision
    - revisit_dependent_rule_switching
  topology_train_samples: 200
  topology_test_samples: 80

# --- Baseline configurations ---
baselines:
  families: ["B0", "B1", "B2", "B3", "B4", "B5", "B6"]
  window_size: 20
  hidden_dim: 64
  labels:
    B0: "FixedWindow"
    B1: "GRU"
    B2: "Transformer"
    B3: "UniformSample"
    B4: "AnchorOnly"
    B5: "Anchor+Proxy"
    B6: "SYNAPSE"

# --- Training ---
training:
  batch_size: 32
  learning_rate: 0.001
  smoke_epochs: 3
  full_epochs: 30
  num_seeds: 3
  device: "cpu"

# --- Public benchmark ---
public_benchmark:
  dataset_path: ""
  smoke_use_synthetic_fallback: true
  seq_len: 80

# --- Acceptance gates ---
acceptance_gates:
  pc05_relative_gain: 0.05
  pc06_min_drop: 0.005

# --- Output ---
output_dir: experiments/outputs

# --- Plotting ---
plotting:
  theme: publication
  formats: [png, pdf]
  dpi: 600
