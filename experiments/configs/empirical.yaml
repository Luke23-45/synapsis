# SYNAPSE Z2 Empirical Experiment Configuration
# Source of truth: docs/formal_math/z2/

memory_operator:
  selector:
    K: 10
    r: 2
    lam: 1.0
    solver: "osqp"
  normalization:
    fit_from_data: true
  lift:
    k: 8
    init: "orthogonal"
  topology:
    Q: 1
  saliency:
    mode: "identity"
    temperature: 1.0
  training_readout:
    enabled: false
    mode: "dense_soft_tokens"
    separate_training_head: true

encoder:
  mode: "sharp"
  alpha: 0.0

trajectory:
  d: 5
  T: 100
  seed: 42

execution:
  num_replications: 50
  seed: 42
  verbose: false
  strict: false

plotting:
  theme: "publication"
  formats: ["png", "pdf"]
  dpi: 600

output_dir: "experiments/outputs"
log_dir: "experiments/outputs/logs"

# Per-experiment overrides
experiments:
  ez2_01_anchor_phase_alignment:
    K_values: [5, 10]
    r_values: [1, 2]
    lam_values: [0.1, 1.0, 5.0]
    k_values: [8]
    normalization_modes: ["fit_from_data"]
    boundary_tolerance: 3

  ez2_02_topology_structure:
    k_values: [4, 8]
    Q_values: [0, 1]
    noise_std: 0.05

  ez2_03_event_sparse_recovery:
    noise_levels: [0.05, 0.3]
    distractor_levels: [0.2, 1.2]
    lambda_values: [0.1, 1.0, 5.0]
    r_values: [1, 2]
    K_values: [10]
    event_recovery_trials: 15
    tolerance: 2

  ez2_04_memory_sufficiency:
    task_families:
      - delayed_retrieval
      - ordered_trigger_response
      - phase_conditioned_decision
    K_values: [10]
    lam_values: [0.1, 1.0]
    k_values: [8]
    num_seeds: 2

# Empirical infrastructure
synthetic_tasks:
  seq_len: 100
  state_dim: 8
  train_samples: 200
  val_samples: 50
  test_samples: 100

baselines:
  families: ["B0", "B1", "B2", "B3", "B4", "B5", "B6", "B7"]
  window_size: 20
  hidden_dim: 64

training:
  batch_size: 32
  learning_rate: 0.001
  smoke_epochs: 3
  full_epochs: 30
  num_seeds: 3
  device: "cpu"

acceptance_gates:
  ez01_boundary_hit_rate: 0.3
  ez01_compression_coverage: 0.4
  ez02_topology_gain: 0.01
  ez03_f1_margin: 0.02
  ez04_accuracy_margin: 0.02
