# SYNAPSE Robotics Applied Validation Configuration
# =====================================================
# Self-contained config for real-trajectory validation
# experiments (AP-00 through AP-04).
#
# Experiments:
#   dataset_audit              - data integrity gate
#   anchor_phase_alignment     - anchors vs phase boundaries
#   compression_retention      - phase/event coverage comparison
#   topology_structure         - persistence diagram separation
#   stability_sensitivity      - robustness to perturbations
#
# This is a non-training analytical track.
# No models, no policies, no learning benchmarks.

# --- Memory operator parameters ---
memory:
  K: 10
  r: 2
  tau: 0.5
  Q: 1
  weights: [1.0, 1.0, 1.0, 1.0]

# --- Applied robotics data ---
applied_data:
  export_root: "applied/robotics/output_data/exports"
  index_json: "applied/robotics/output_data/raw/final_training_set/training_set_index.json"
  smoke_max_episodes: 2
  min_episode_length: 20
  # Perturbation parameters (stability experiment)
  noise_sigmas: [0.001, 0.005, 0.01, 0.05]
  drop_probs: [0.05, 0.1, 0.2]
  truncation_fractions: [0.8, 0.6, 0.4]
  # Anchor alignment tolerance (timesteps)
  boundary_tolerance: 3

# --- Acceptance gates ---
acceptance_gates:
  applied_boundary_hit_rate: 0.3
  applied_compression_coverage: 0.4
  applied_stability_jaccard: 0.5

# --- Output ---
output_dir: experiments/outputs

# --- Plotting ---
plotting:
  theme: publication
  formats: [png, pdf]
  dpi: 600
