# SYNAPSE Memory Operator — Default Experiment Configuration
# ==========================================================
# Authoritative source for all formal definitions:
#   docs/formal_math/01_main_definition.md
#   docs/formal_math/02_rigorous_architecture.md

# --- Core memory operator parameters ---
memory_operator:
  K: 10                    # Maximum anchor budget
  r: 2                     # Minimum refractory separation
  tau: 0.5                 # Event score threshold
  Q: 1                     # Maximum homology degree retained
  weights:
    w_t: 1.0               # Temporal weight in geometric lift
    w_x: 1.0               # Spatial weight
    w_delta: 1.0            # Gap weight
    w_e: 1.0               # Event score weight

# --- Hysteretic encoder ---
encoder:
  mode: sharp              # 'sharp' or 'hysteretic'
  alpha: 0.0               # Hysteresis gate (0 = sharp)

# --- Trajectory generation defaults ---
trajectory:
  d: 5                     # Ambient dimension
  T: 100                   # Default trajectory length
  seed: 42                 # Base random seed

# --- Experiment execution ---
execution:
  num_replications: 50     # Per-configuration replications
  seed: 42                 # Master seed
  verbose: false
  strict: false            # Stop on first failure

# --- Verification thresholds ---
verification:
  score_match_atol: 1.0e-14        # Absolute tolerance for score comparison
  reconstruction_atol: 1.0e-14     # Tolerance for reconstruction error
  hausdorff_rtol: 1.0e-10          # Relative tolerance for Hausdorff bound
  bottleneck_rtol: 1.0e-10         # Relative tolerance for bottleneck bound
  history_diff_threshold: 1.0e-10  # Minimum score diff for history dependence

# --- Per-experiment overrides ---
experiments:
  exp01_causality:
    dims: [2, 5, 10]
    lengths: [50, 100, 200]
    num_perturbations: 50
    alpha_values: [0.3, 0.7]

  exp02_bounded_cardinality:
    K_values: [1, 5, 10, 50]
    r_values: [0, 1, 5, 10]
    tau_values: [0.01, 0.1, 1.0]
    T_values: [100, 500]
    num_trials: 100

  exp03_changepoint_identification:
    dims: [1, 3, 10]
    num_trials: 200
    jump_magnitude_factor: 20.0

  exp04_exact_reconstruction:
    dims: [1, 3, 10]
    T_values: [50, 200, 500]
    num_trials: 50

  exp05_topological_stability:
    m_values: [5, 10, 20]
    D_values: [5, 8]
    epsilon_values: [0.001, 0.01, 0.05, 0.1, 0.5, 1.0]
    num_perturbations: 50

  exp06_hysteretic_encoding:
    num_sharp_trials: 1000
    num_alpha0_trials: 500
    alpha_values: [0.3, 0.5, 0.7, 0.95]
    num_history_pairs: 200

  exp07_information_loss:
    num_collision_attempts: 100
    num_trajectories: 200
    K_sweep: [1, 3, 5, 10, 20]

  exp08_end_to_end_integration:
    dims_normal: [1, 3, 10]
    dims_edge: [1, 5, 50]
    alpha_values: [0.3, 0.7]

# --- Output ---
output_dir: experiments/outputs

# --- Plotting ---
plotting:
  theme: publication        # 'publication' or 'dark'
  formats: [png, pdf]       # Export formats
  dpi: 600                  # DPI for raster outputs
