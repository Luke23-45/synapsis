# SYNAPSE Z2 Experiment Configuration
# Source of truth: docs/formal_math/z2/

memory_operator:
  selector:
    K: 10
    r: 2
    lam: 1.0
    solver: "osqp"
  normalization:
    fit_from_data: true
  lift:
    k: 8
    init: "orthogonal"
  topology:
    Q: 1
  saliency:
    mode: "identity"
    temperature: 1.0
  training_readout:
    enabled: false
    mode: "dense_soft_tokens"
    separate_training_head: true

encoder:
  mode: "sharp"
  alpha: 0.0

trajectory:
  d: 5
  T: 100
  seed: 42

execution:
  num_replications: 50
  seed: 42
  verbose: false
  strict: false

verification:
  score_match_atol: 1.0e-14
  reconstruction_atol: 1.0e-14
  hausdorff_rtol: 1.0e-10
  bottleneck_rtol: 1.0e-10
  history_diff_threshold: 1.0e-10

plotting:
  theme: "publication"
  formats: ["png", "pdf"]
  dpi: 600

output_dir: "experiments/outputs"
log_dir: "experiments/outputs/logs"

# Per-experiment overrides
experiments:
  vz2_01_relaxed_selector:
    dims: [2, 5, 10]
    lengths: [50, 100, 200]
    lambda_values: [0.1, 0.5, 1.0, 5.0]
    num_perturbations: 50

  vz2_02_hard_projection:
    dims: [2, 5, 10]
    lengths: [50, 100, 200]
    K_values: [3, 5, 10, 20]
    r_values: [0, 1, 2, 5]

  vz2_03_exact_recovery:
    dims: [3]
    lengths: [100]
    num_trials: 5 

    # dims: [3, 5]
    # lengths: [100, 200]
    # num_trials: 10
  vz2_04_full_operator:
    dims: [3]
    lengths: [50]
    K_values: [5]
    encoder_modes: ["sharp"]
    bounded_trials: 2

  vz2_05_topological_stability:
    m_values: [5]
    D_values: [5]
    epsilon_values: [0.1]
    num_perturbations: 10

  vz2_06_sufficiency_metric:
    dims: [3]
    lengths: [100]
    k_values: [4]
    max_evaluations: 50

  vz2_07_encoder_saliency:
    dims: [2, 5]
    lengths: [50, 100]
    alpha_values: [0.2, 0.6]
    num_perturbations: 20
    saliency_modes: ["identity", "z_score", "temperature"]
    temperatures: [0.5, 1.0, 2.0]

  vz2_08_anchor_geometry_readout:
    dims: [2, 4]
    lengths: [40, 80]
    num_trials: 10

  # --- Empirical experiment overrides ---
  ez2_01_anchor_phase_alignment:
    K_values: [5, 10, 20]
    r_values: [1, 2, 5]
    lam_values: [0.1, 0.5, 1.0, 5.0]
    k_values: [4, 8]
    normalization_modes: ["fit_from_data", "identity"]
    boundary_tolerance: 3

  ez2_02_topology_structure:
    k_values: [2, 4, 8, 16]
    Q_values: [0, 1]
    noise_std: 0.05

  ez2_03_event_sparse_recovery:
    noise_levels: [0.05, 0.15, 0.3]
    distractor_levels: [0.2, 0.6, 1.2]
    lambda_values: [0.01, 0.1, 0.5, 1.0, 5.0, 10.0]
    r_values: [0, 1, 2, 5]
    K_values: [5, 10]
    event_recovery_trials: 30
    tolerance: 2

  ez2_04_memory_sufficiency:
    task_families:
      - delayed_retrieval
      - ordered_trigger_response
      - phase_conditioned_decision
      - revisit_dependent_rule_switching
    K_values: [5, 10, 20]
    lam_values: [0.1, 0.5, 1.0]
    k_values: [4, 8]
    num_seeds: 3

# --- Empirical infrastructure ---
synthetic_tasks:
  seq_len: 100
  state_dim: 8
  train_samples: 200
  val_samples: 50
  test_samples: 100

baselines:
  families: ["B0", "B1", "B2", "B3", "B4", "B5", "B6", "B7"]
  window_size: 20
  hidden_dim: 64

training:
  batch_size: 32
  learning_rate: 0.001
  smoke_epochs: 3
  full_epochs: 30
  num_seeds: 3
  device: "cpu"

acceptance_gates:
  ez01_boundary_hit_rate: 0.3
  ez01_compression_coverage: 0.4
  ez02_topology_gain: 0.01
  ez03_f1_margin: 0.02
  ez04_accuracy_margin: 0.02
