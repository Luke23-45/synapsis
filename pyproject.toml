[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synapsis"
version = "1.0.0"
description = "SOTA Robotics Framework with NTH-Attention for Temporal Reasoning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pandas>=2.0",
    "tqdm>=4.66",
    "opencv-python>=4.8.0",
    "mujoco>=3.0.0",
    "transformers>=4.30.0",
    "lmdb>=1.4.0",
    "wandb>=0.16.0",
    "ikpy>=3.0.0",
    "gymnasium>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.12",
]

[tool.setuptools.packages.find]
where = ["."]
